services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: java_knight_realms
      MYSQL_USER: java_knight_app
      MYSQL_PASSWORD: database_project
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./db/demo.sql:/docker-entrypoint-initdb.d/zz-demo.sql:ro
      - ./db/map.sql:/docker-entrypoint-initdb.d/zz-map.sql:ro
      - ./db/triggers.sql:/docker-entrypoint-initdb.d/triggers.sql:ro
      - ./db/procedure.sql:/docker-entrypoint-initdb.d/zz-procedure.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
