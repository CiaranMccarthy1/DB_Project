<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login - Java Knight</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<main class="menu">
  <h1>Java Knight</h1>
  <form id="login-form">
    <div><label>Username <input id="username" name="username" autocomplete="username" required autofocus></label></div>
    <div><label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label></div>
    <button type="submit">Log in</button>
  </form>
  <p id="login-error" role="alert"></p>
  <p>No account? <a href="register.html">Create account</a></p>
</main>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
